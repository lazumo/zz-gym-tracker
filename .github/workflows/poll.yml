name: poll

# 主驅動：自鏈式 — 每跑完一次 sleep 14 分鐘、再 API 觸發自己。
# 備援 cron：每 6 小時，當鏈條斷掉時自動重啟。
# 不依賴 GitHub 的 schedule cold start (新 repo 通常要 1-12 小時才會開始發 schedule)。

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # backup safety net only

permissions:
  contents: write
  actions: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: python poller.py

      - name: Commit data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: poll $(date -u +'%Y-%m-%dT%H:%MZ')"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "push race, retry $i"
            sleep $((i * 3))
          done
          echo "push failed after 5 retries"
          exit 1

      - name: Regenerate today's heatmap if missing
        if: always()
        run: |
          TODAY=$(TZ=Asia/Taipei date +%Y-%m-%d)
          if [ -f "reports/heatmap-$TODAY.png" ]; then
            echo "today's heatmap ($TODAY) already exists, skipping"
            exit 0
          fi
          echo "first poll of $TODAY Taipei, regenerating heatmap"
          python report.py
          git add reports/
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "report: daily $TODAY"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "push race, retry $i"
            sleep $((i * 3))
          done
          echo "report push failed; will retry on next poll"
          exit 0

      - name: Sleep 14 min, then chain next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Sleeping 14 min before chaining..."
          sleep 840
          echo "Dispatching next poll..."
          gh workflow run poll.yml --repo "$GITHUB_REPOSITORY"
